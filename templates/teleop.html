<!DOCTYPE html>
<html>
<head>
    <!-- user-scalable=no prevents zooming while dragging the sliders on a phone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
    <title>Robot remote control</title>
    <style>
        body {
            width: 280px;
            height: 150px;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 100px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 100px;
            height: 100px;
            background-color: #faee00;
            border-radius: 50%;
        }
        #forwardContainer {
            position: absolute;
            left: 70px;
            top: 60px;
        }
        #vertical {
            width: 300px;
            height: 300px;
            transform: rotate(-90deg);
        }
        #turnContainer {
            position: absolute;
            right: 40px;
            top: 175px;
        }
        #horizontal {
            width: 300px;
            height: 20px;
        }
    </style>
</head>
<body>
    <h1>Robot remote control</h1>
    <div id="forwardContainer">
        <input type="range" id="vertical" min="-100" max="100" value="0">
    </div>
    <div id="turnContainer">
        <input type="range" id="horizontal" min="-100" max="100" value="0">
    </div>

    <script>
        const socket = io();

        // Send the slider value on every move, and reset it to 0 when released.
        for (const name of ["vertical", "horizontal"]) {
            const slider = document.getElementById(name);
            slider.addEventListener("input", () => socket.emit(name, {value: slider.value}));
            slider.addEventListener("change", () => {
                slider.value = 0;
                socket.emit(name, {value: 0});
            });
        }
    </script>
</body>
</html>
