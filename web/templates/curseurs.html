<!DOCTYPE html>
<html>
<head>
   
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
            
	<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

    <title>Contrôle des curseurs</title>
    <style>
        input[type="range"]  {
        -webkit-appearance: none;
        width: 100%;
        height: 100px; /* Hauteur des boutons */
  }
        input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 100px; /* Largeur des boutons */
        height: 100px; /* Hauteur des boutons */
        background-color: #faee00; /* Couleur des boutons */
        border-radius: 50%; /* Forme des boutons (rond) */

        }


        body {
            width: 280px; /* Largeur de la page */
            height: 150px; /* Hauteur de la page */
            margin: 0;
            padding: 0;
            overflow: hidden; /*empêche redimmensionnement et zoom sur tel*/
        }
        

        /* Styles pour le conteneur du curseur 1 (vertical) */
        #curseur1Container {
            position: absolute;
            left: 70px; /* Position à 20px de la gauche */
            top: 60px; /* Position en haut à 50px du haut */
        }
    
        #vertical {
            width: 300px;
            height: 300px; 
            transform: rotate(-90deg); /* curseur vertical */
        }

    
        /* Styles pour le conteneur du curseur 2 (horizontal) */
        #curseur2Container {
            position: absolute;
            right: 40px; /* Position à 20px de la droite */
            top: 175px; /* Position en haut à 50px du haut */
        }

        /* Styles pour agrandir le curseur 2 */
        #horizontal {
            width: 300px; 
            height: 20px; 
        }

        
    </style>
</head>
<body>
    <h1>Commandes Kev</h1>
    
    
    <div id="curseur1Container">
        <input type="range" id="vertical" min="-100" max="100" value="0">
    </div>

    <!-- Curseur 2 (horizontal) -->
    <div id="curseur2Container">
        <input type="range" id="horizontal" min="-100" max="100" value="0">
    </div>

    <script>
        

        const vertical = document.getElementById("vertical");

        
        const horizontal = document.getElementById("horizontal");
 
        

        
       
        // Réinitialiser les curseurs à leur valeur initiale lorsqu'ils sont relâchés (événement "change")
        vertical.addEventListener("change", function() {
            vertical.value = 0;
            sendSliderPosition("vertical", this.value);
            

        });

        horizontal.addEventListener("change", function() {
            horizontal.value = 0;
	    
            
        });

            function sendSliderPosition(address, value) {
                    $.ajax({
                        url: '/'+address,
                        type: 'POST',
                        data: { 'value': value },
                        success: function(response) {
                            // Traitez la réponse si nécessaire
                        }
                    });
                }



        vertical.addEventListener("input", function(){
            sendSliderPosition("vertical", this.value)
        })

        horizontal.addEventListener("input", function(){
            sendSliderPosition("horizontal", this.value)
        })
        
      


    </script>
    
</body>
</html>
