<!DOCTYPE html>
<html>
<head>
   
    <meta http-equiv='content-type' content='text/html; charset=UTF-8'>
            <meta name='apple-mobile-web-app-capable' content='yes' />
            <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

    <title>Contrôle des curseurs</title>
    <style>
        input[type="curseur1"]  {
        -webkit-appearance: none;
        width: 100%;
        height: 100px; /* Hauteur des boutons */
  }
        input[type="curseur1"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 100px; /* Largeur des boutons */
        height: 100px; /* Hauteur des boutons */
        background-color: #faee00; /* Couleur des boutons */
        border-radius: 50%; /* Forme des boutons (rond) */

        }

               input[type="curseur2"]  {
        -webkit-appearance: none;
        width: 100%;
        height: 100px; /* Hauteur des boutons */
  }
        input[type="curseur2"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 100px; /* Largeur des boutons */
        height: 100px; /* Hauteur des boutons */
        background-color: #faee00; /* Couleur des boutons */
        border-radius: 50%; /* Forme des boutons (rond) */

        }
        body {
            width: 280px; /* Largeur de la page */
            height: 150px; /* Hauteur de la page */
            margin: 0;
            padding: 0;
            overflow: hidden; /*empêche redimmensionnement et zoom sur tel*/
        }
        

        /* Styles pour le conteneur du curseur 1 (vertical) */
        #curseur1Container {
            position: absolute;
            left: 70px; /* Position à 20px de la gauche */
            top: 60px; /* Position en haut à 50px du haut */
        }
    
        #curseur1 {
            width: 300px;
            height: 300px; 
            transform: rotate(-90deg); /* curseur vertical */
        }

    
        /* Styles pour le conteneur du curseur 2 (horizontal) */
        #curseur2Container {
            position: absolute;
            right: 40px; /* Position à 20px de la droite */
            top: 175px; /* Position en haut à 50px du haut */
        }

        /* Styles pour agrandir le curseur 2 */
        #curseur2 {
            width: 300px; 
            height: 20px; 
        }

        
    </style>
</head>
<body>
    <h1>Commandes Kev</h1>
    
    
    <div id="curseur1Container">
        <input type="curseur1" id="curseur1" min="-100" max="100" value="0">
    </div>

    <!-- Curseur 2 (horizontal) -->
    <div id="curseur2Container">
        <input type="curseur2" id="curseur2" min="-100" max="100" value="0">
    </div>

    <script>
        

        const curseur1 = document.getElementById("curseur1");

        const initialCurseur1Value = curseur1.value; // Valeur initiale

        const curseur2 = document.getElementById("curseur2");
 
        const initialCurseur2Value = curseur2.value; // Valeur initiale
        
        function updateCurseurValue(curseur, valueElement) {
            valueElement.textContent = "Valeur : " + curseur.value;
        }
        
        
       
        // Réinitialiser les curseurs à leur valeur initiale lorsqu'ils sont relâchés (événement "change")
        curseur1.addEventListener("change", function() {
            curseur1.value = initialCurseur1Value;
        
        });

        curseur2.addEventListener("change", function() {
            curseur2.value = initialCurseur2Value;
            
        });

            function sendSliderPosition(pin, value) {
                    $.ajax({
                        url: '/setPinValue',
                        type: 'POST',
                        data: { 'pin': pin, 'value': value },
                        success: function(response) {
                            // Traitez la réponse si nécessaire
                        }
                    });
                }

         // Écouteur d'événements pour les changements de curseurs
        $('#sliderContainer input[type="curseur1"]').on('input change', function() {
            var pin = "vertical"; // Extraire le numéro du pin
            var value = $(this).val(); // Valeur du curseur
            $('#valueGPIO' + pin).text(value); // Mise à jour de l'affichage de la valeur
            sendSliderPosition(pin, value); // Envoyer la valeur au serveur
           });

        $('#sliderContainer input[type="curseur2"]').on('input change', function() {
            var pin = "horizontal"; // Extraire le numéro du pin
            var value = $(this).val(); // Valeur du curseur
            $('#valueGPIO' + pin).text(value); // Mise à jour de l'affichage de la valeur
            sendSliderPosition(pin, value); // Envoyer la valeur au serveur
           });


        

        
      


    </script>
    
</body>
</html>
